server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

# Tempo 3.0 replaced the ingester and compactor components with live_store,
# block_builder and the backend scheduler/worker pair. These two keys are the
# 2.x `ingester.max_block_duration` and `compactor.compaction.block_retention`.
live_store:
  max_block_duration: 5m

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 48h

backend_worker:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
