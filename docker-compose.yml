name: finflow

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: finflow
      MARIADB_USER: finflow
      MARIADB_PASSWORD: finflow
      MARIADB_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      target: build
    image: finflow-migrate
    command: ['npm', 'run', 'db:migrate:deploy']
    environment:
      DATABASE_URL: mysql://finflow:finflow@mariadb:3306/finflow
    depends_on:
      mariadb:
        condition: service_healthy
    restart: 'no'

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - '3200:3200'
      - '4318:4318'

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Admin'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '3000:3000'
    depends_on:
      - tempo

  app:
    build:
      context: .
      target: runtime
    image: finflow-app
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - '8000:8000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8000'
      DATABASE_URL: mysql://finflow:finflow@mariadb:3306/finflow
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-secret-change-me-min-32-characters}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-only-cookie-secret-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: 'false'
      METRICS_ENABLED: 'true'
      OTEL_ENABLED: 'true'
      OTEL_SERVICE_NAME: finflow-api
      OTEL_SERVICE_VERSION: '1.0.0'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tempo:
        condition: service_started

volumes:
  tempo-data:
  mariadb-data:
  redis-data:
