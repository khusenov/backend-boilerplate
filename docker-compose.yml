name: app
x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-app}
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: '8000'
  DATABASE_URL: mysql://app:app@mariadb:3306/app
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-secret-change-me-min-32-characters}
  COOKIE_SECRET: ${COOKIE_SECRET:-dev-only-cookie-secret-change-me}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
  EMAIL_FROM: ${EMAIL_FROM:-no-reply@app.local}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_REQUIRE_TLS: 'false'
  VERIFICATION_CODE_SECRET: ${VERIFICATION_CODE_SECRET:-dev-only-verification-secret-change-me-32chars}
  PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-http://localhost:5173/reset-password}
  COOKIE_SECURE: 'false'
  METRICS_ENABLED: 'true'
  OTEL_ENABLED: 'true'
  OTEL_SERVICE_NAME: app-api
  OTEL_SERVICE_VERSION: '1.0.0'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  BULL_BOARD_ENABLED: true
  BULL_BOARD_PATH: /admin/queues
  BULL_BOARD_USERNAME: admin
  BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-dev-only-bull-board-password}
  BULL_BOARD_READONLY: true

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      target: build
    image: app-migrate
    command: ['npm', 'run', 'db:migrate:deploy']
    environment:
      DATABASE_URL: mysql://app:app@mariadb:3306/app
    depends_on:
      mariadb:
        condition: service_healthy
    restart: 'no'

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - '3200:3200'
      - '4318:4318'

  loki:
    image: grafana/loki:3.3.0
    container_name: app-loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - '3100:3100'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3100/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  alloy:
    image: grafana/alloy:v1.5.0
    container_name: app-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - '12345:12345'
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Admin'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '3000:3000'
    depends_on:
      - tempo
      - loki

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      target: runtime
    image: app-app
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - '8000:8000'
    environment:
      <<: *app-environment
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tempo:
        condition: service_started
      mailpit:
        condition: service_healthy

  worker:
    build:
      context: .
      target: runtime
    image: app-app
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    command: ['node', '--import', './dist/instrumentation.js', 'dist/worker.js']
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: app-worker
      WORKER_PORT: '8001'
    ports:
      - '127.0.0.1:8001:8001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tempo:
        condition: service_started
      mailpit:
        condition: service_healthy

volumes:
  tempo-data:
  loki-data:
  alloy-data:
  mariadb-data:
  redis-data:
