version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      bull-board:
        patterns:
          - '@bull-board/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vitest-mock-extended'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
