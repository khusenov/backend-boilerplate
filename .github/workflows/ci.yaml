name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate architecture boundaries
        run: npm run arch

      - name: Build production bundle
        run: npm run build

      - name: Unit tests (with coverage)
        run: npm run test:coverage

  integration:
    name: Integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Integration tests (Testcontainers + MariaDB)
        run: npm run test:integration

  docker:
    name: Docker image & smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file resolves
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (with cross-run layer cache)
        uses: docker/bake-action@v6
        with:
          files: docker-compose.yml
          load: true
          set: |
            migrate.cache-from=type=gha,scope=migrate
            migrate.cache-to=type=gha,mode=max,scope=migrate
            app.cache-from=type=gha,scope=app
            app.cache-to=type=gha,mode=max,scope=app

      - name: Boot the stack and wait for the app to become healthy
        timeout-minutes: 6
        run: docker compose up --detach --wait --wait-timeout 180 app worker

      - name: Assert the published port serves liveness
        run: >
          curl --fail --show-error --silent
          --retry 30 --retry-delay 2 --retry-all-errors
          http://localhost:8000/health/live

      - name: Assert readiness (the app's own MariaDB + Redis connectivity)
        run: >
          curl --fail --show-error --silent
          --retry 30 --retry-delay 2 --retry-all-errors
          http://localhost:8000/health/ready

      - name: Assert the worker serves liveness
        run: >
          curl --fail --show-error --silent
          --retry 30 --retry-delay 2 --retry-all-errors
          http://localhost:8001/health/live

      - name: Assert the worker readiness (its own MariaDB + Redis connectivity)
        run: >
          curl --fail --show-error --silent
          --retry 30 --retry-delay 2 --retry-all-errors
          http://localhost:8001/health/ready

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
