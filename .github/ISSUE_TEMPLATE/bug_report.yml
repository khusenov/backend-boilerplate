name: Bug report
description: Something behaves differently from what the documentation describes
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not use this form — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers it. Include the request and response if it is an HTTP issue.
      placeholder: |
        1. npm run dev
        2. curl -X POST localhost:8000/v1/...
        3. Response is 500 instead of 400
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste the relevant log lines. Redact any secret before pasting.
      render: shell

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: 'node --version'
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How are you running it
      options:
        - npm run dev on the host
        - docker compose up
        - Deployed elsewhere
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I ran `npm run db:generate` after cloning
          required: true
        - label: '`npm run audit` reproduces the problem, or the problem is not covered by it'
          required: false
